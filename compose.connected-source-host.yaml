services:
  # A pre-state rapid source-validation host may reuse only images that are
  # already present locally. Immutable/offline profiles continue to use the
  # digest pin or a checksum-verified release override.
  postgres:
    image: ${SOURCE_HOST_POSTGRES_IMAGE:-pgvector/pgvector:0.8.2-pg17-bookworm}
    pull_policy: never

  # The preparation PC already owns the reviewed, theme-bearing final image.
  # Never rebuild or pull it during a loopback port transition.
  keycloak:
    image: ${SOURCE_HOST_KEYCLOAK_IMAGE:-datariver-keycloak:26.7.0}
    pull_policy: never

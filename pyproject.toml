[project]
name = "datariver-next"
version = "0.1.0"
description = "Secure DataHub catalog facade and governed knowledge-graph control plane"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "boto3==1.43.13",
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "orjson==3.11.9",
  "prometheus-client==0.25.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.22",
  "PyJWT[crypto]>=2.10.1,<3",
  "redis>=6.0,<7",
  "SQLAlchemy==2.0.49",
  "structlog>=25.0,<26",
  "uvicorn[standard]==0.47.0",
  "pypdf==6.8.0",
  "neo4j==6.0.3",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]==1.43.13",
  "httpx2==2.5.0",
  "mypy>=1.18,<2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/datariver"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
mypy_path = "backend/src"
exclude = ["backend/alembic"]

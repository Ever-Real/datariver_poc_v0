services:
  # This overlay is intentionally separate from compose.host-dev.yaml: the
  # latter must remain valid when Airflow is not selected. When Airflow is
  # selected, all DAG calls use APISIX so they follow the same dynamically
  # discovered WSL-to-host source API route as the browser.
  airflow-api-server:
    environment:
      DATARIVER_API_BASE_URL: ${DATARIVER_API_BASE_URL:-http://apisix:9080}

  airflow-scheduler:
    environment:
      DATARIVER_API_BASE_URL: ${DATARIVER_API_BASE_URL:-http://apisix:9080}

  airflow-dag-processor:
    environment:
      DATARIVER_API_BASE_URL: ${DATARIVER_API_BASE_URL:-http://apisix:9080}

  airflow-triggerer:
    environment:
      DATARIVER_API_BASE_URL: ${DATARIVER_API_BASE_URL:-http://apisix:9080}

services:
  # This overlay is intentionally separate from compose.host-dev.yaml: the
  # latter must remain valid when Airflow is not selected. When Airflow is
  # selected with the governed Mac gateway, all DAG calls use the same
  # transparent APISIX API hop as the browser.
  airflow-api-server:
    environment:
      DATARIVER_API_BASE_URL: http://apisix:9080

  airflow-scheduler:
    environment:
      DATARIVER_API_BASE_URL: http://apisix:9080
      DATARIVER_QUALITY_DISPATCH_API_BASE_URL: http://apisix:9080

  airflow-dag-processor:
    environment:
      DATARIVER_API_BASE_URL: http://apisix:9080

  airflow-triggerer:
    environment:
      DATARIVER_API_BASE_URL: http://apisix:9080

name: datariver-next

# Optional Single-node Pilot observability overlay. It intentionally starts no
# exporter inside the DataRiver application: target deployment owners must add
# reviewed OTLP instrumentation and a least-privilege metrics scrape identity.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v3.12.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3300}
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  alertmanager:
    image: prom/alertmanager:v0.32.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - observability
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  tempo:
    image: grafana/tempo:2.10.5
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  loki:
    image: grafana/loki:3.7.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

networks:
  observability:
    internal: true

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  tempo-data:
  loki-data:

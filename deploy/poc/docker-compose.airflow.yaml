name: datariver-poc-airflow

services:
  airflow:
    image: ${POC_AIRFLOW_IMAGE:-datariver-airflow:3.3.0-python3.12}
    platform: ${POC_PLATFORM:-linux/amd64}
    entrypoint: ["/bin/bash", "/opt/datariver/poc-airflow-entrypoint.sh"]
    environment:
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:?AIRFLOW_USERNAME is required}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD is required}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_USERNAME:?AIRFLOW_USERNAME is required}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
      AIRFLOW__API__BASE_URL: http://airflow:8080
      DATARIVER_POC_OPEN_ACCESS: "true"
      DATARIVER_WORKSPACE_ID: ${AIRFLOW_WORKSPACE_ID:-00000000-0000-4000-8000-000000000061}
      DATARIVER_API_BASE_URL: ${AIRFLOW_DATARIVER_URL:-http://host.docker.internal:39080}
      NO_PROXY: localhost,127.0.0.1,host.docker.internal,airflow,${EXTERNAL_SERVICE_NO_PROXY:-}
      no_proxy: localhost,127.0.0.1,host.docker.internal,airflow,${EXTERNAL_SERVICE_NO_PROXY:-}
    ports:
      - "${AIRFLOW_BIND_HOST:-0.0.0.0}:${AIRFLOW_PORT:-18888}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../infra/airflow/dags/bulk_registration_prepare.py:/opt/airflow/dags/bulk_registration_prepare.py:ro
      - ../../infra/airflow/dags/datariver_bulk_registration.py:/opt/airflow/dags/datariver_bulk_registration.py:ro
      - ../../infra/airflow/dags/datariver_auth.py:/opt/airflow/dags/datariver_auth.py:ro
      - ./airflow-entrypoint.sh:/opt/datariver/poc-airflow-entrypoint.sh:ro
      - airflow-state:/opt/airflow
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

volumes:
  airflow-state:

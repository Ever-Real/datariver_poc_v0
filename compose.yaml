name: datariver-next

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - .env
  networks:
    - app
    - data
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datariver}
      POSTGRES_USER: ${POSTGRES_USER:-datariver_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_relay_password
      - postgres_upload_password
      - postgres_governance_password
      - postgres_bootstrap_password
      - keycloak_db_password
      - airflow_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true

  valkey-cache:
    image: valkey/valkey:9.1.0-alpine
    command:
      - /bin/sh
      - -ec
      - >-
        exec valkey-server
        --bind 0.0.0.0
        --protected-mode yes
        --requirepass "$$(cat /run/secrets/valkey_cache_password)"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lfu
        --save ""
        --appendonly no
    secrets:
      - valkey_cache_password
    networks:
      - data
    healthcheck:
      test:
        ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(cat /run/secrets/valkey_cache_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  valkey-queue:
    image: valkey/valkey:9.1.0-alpine
    command:
      - /bin/sh
      - -ec
      - >-
        exec valkey-server
        --bind 0.0.0.0
        --protected-mode yes
        --requirepass "$$(cat /run/secrets/valkey_queue_password)"
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --appendonly yes
        --appendfsync everysec
        --save ""
    secrets:
      - valkey_queue_password
    volumes:
      - valkey-queue-data:/data
    networks:
      - data
    healthcheck:
      test:
        ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(cat /run/secrets/valkey_queue_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  seaweedfs:
    image: chrislusf/seaweedfs:4.39_full
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/run/secrets/seaweed_s3_config
      - -master.volumeSizeLimitMB=1024
    secrets:
      - seaweed_s3_config
    volumes:
      - seaweed-data:/data
    networks:
      - data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend
    secrets:
      - postgres_password
    command: ["/app/.venv/bin/alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-init:
    <<: *backend
    secrets:
      - s3_access_key
      - s3_secret_key
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.storage_init"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  semiconductor-seed:
    <<: *backend
    profiles: ["semiconductor-seed"]
    command:
      ["/app/.venv/bin/python", "-m", "datariver.seed", "apply", "--confirm-synthetic-data"]
    environment:
      SEED_PROFILE: semiconductor
    secrets:
      - postgres_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"

  local-bootstrap:
    <<: *backend
    profiles: ["tools"]
    command: ["/app/.venv/bin/python", "-m", "datariver.bootstrap", "local-identity"]
    secrets:
      - postgres_bootstrap_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"

  api:
    <<: *backend
    secrets:
      - postgres_app_password
      - valkey_cache_password
      - datahub_token
      - s3_access_key
      - s3_secret_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  outbox-relay:
    <<: *backend
    secrets:
      - postgres_relay_password
      - valkey_queue_password
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.outbox_relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey-queue:
        condition: service_healthy
    networks:
      - data
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  upload-worker:
    <<: *backend
    secrets:
      - postgres_upload_password
      - valkey_queue_password
      - s3_access_key
      - s3_secret_key
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.upload_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - data
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  upload-validation-worker:
    <<: *backend
    secrets:
      - postgres_upload_password
      - valkey_queue_password
      - s3_access_key
      - s3_secret_key
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.upload_validation"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - data
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  governance-apply-worker:
    <<: *backend
    secrets:
      - postgres_governance_password
      - valkey_queue_password
      - datahub_token
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.governance_apply"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - data
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_OIDC_AUTHORITY: ${OIDC_PUBLIC_AUTHORITY:-http://localhost:8081/realms/datariver}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-datariver-web}
        VITE_OIDC_REDIRECT_URI: ${APP_PUBLIC_ORIGIN:-http://localhost:8080}
        VITE_OIDC_HIGH_ASSURANCE_ACR: ${OIDC_STEP_UP_ACR:-2}
        VITE_OIDC_PASSWORD_REAUTH_ACR: ${OIDC_PASSWORD_REAUTH_REQUEST_ACR:-1}
    environment:
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:-http://localhost:8333}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:-http://localhost:8081}
      DATAHUB_EMBED_BASE_URL: ${DATAHUB_EMBED_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  app:
    internal: false
  data:
    internal: true

volumes:
  postgres-data:
  valkey-queue-data:
  seaweed-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  postgres_relay_password:
    file: ./secrets/postgres_relay_password
  postgres_upload_password:
    file: ./secrets/postgres_upload_password
  postgres_governance_password:
    file: ./secrets/postgres_governance_password
  postgres_bootstrap_password:
    file: ./secrets/postgres_bootstrap_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  airflow_db_password:
    file: ./secrets/airflow_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  airflow_client_secret:
    file: ./secrets/airflow_client_secret
  airflow_api_secret:
    file: ./secrets/airflow_api_secret
  airflow_admin_password:
    file: ./secrets/airflow_admin_password
  valkey_cache_password:
    file: ./secrets/valkey_cache_password
  valkey_queue_password:
    file: ./secrets/valkey_queue_password
  datahub_token:
    file: ./secrets/datahub_token
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  seaweed_s3_config:
    file: ./secrets/seaweed_s3_config.json
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

name: datariver-next

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - ${DATARIVER_ENV_FILE:-.env}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - app
    - data
    - connectors
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datariver}
      POSTGRES_USER: ${POSTGRES_USER:-datariver_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_relay_password
      - postgres_upload_password
      - postgres_governance_password
      - postgres_export_password
      - postgres_retention_scheduler_password
      - postgres_archive_password
      - postgres_bootstrap_password
      - keycloak_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend
    secrets:
      - postgres_password
      - postgres_export_password
    command: ["/app/.venv/bin/alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-init:
    <<: *backend
    profiles: ["object-storage-tools"]
    secrets:
      - s3_access_key
      - s3_secret_key
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.storage_init"]
    networks:
      - data
      - connectors
    restart: "no"

  semiconductor-seed:
    <<: *backend
    profiles: ["semiconductor-seed"]
    command:
      ["/app/.venv/bin/python", "-m", "datariver.seed", "apply", "--confirm-synthetic-data"]
    environment:
      SEED_PROFILE: semiconductor
    secrets:
      - postgres_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"

  local-bootstrap:
    <<: *backend
    profiles: ["tools"]
    command: ["/app/.venv/bin/python", "-m", "datariver.bootstrap", "local-identity"]
    secrets:
      - postgres_bootstrap_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"

  api:
    <<: *backend
    secrets:
      - postgres_app_password
      - redis_cache_password
      - source: redis_cache_password
        target: valkey_cache_password
      - datahub_token
      - intranet_llm_chat_api_key
      - intranet_llm_embedding_api_key
      - neo4j_auth
      - keycloak_identity_admin_client_secret
      - s3_access_key
      - s3_secret_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  outbox-relay:
    <<: *backend
    secrets:
      - postgres_relay_password
      - redis_delivery_password
      - source: redis_delivery_password
        target: valkey_queue_password
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.outbox_relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - connectors
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  upload-worker:
    <<: *backend
    secrets:
      - postgres_upload_password
      - redis_delivery_password
      - source: redis_delivery_password
        target: valkey_queue_password
      - s3_access_key
      - s3_secret_key
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.upload_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - connectors
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  upload-validation-worker:
    <<: *backend
    secrets:
      - postgres_upload_password
      - redis_delivery_password
      - source: redis_delivery_password
        target: valkey_queue_password
      - s3_access_key
      - s3_secret_key
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.upload_validation"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - connectors
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  governance-apply-worker:
    <<: *backend
    secrets:
      - postgres_governance_password
      - redis_delivery_password
      - source: redis_delivery_password
        target: valkey_queue_password
      - datahub_token
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.governance_apply"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - data
      - connectors
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  catalog-export-worker:
    <<: *backend
    profiles: ["catalog-export"]
    secrets:
      - postgres_export_password
      - redis_delivery_password
      - source: redis_delivery_password
        target: valkey_queue_password
      - s3_export_access_key
      - s3_export_secret_key
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.catalog_export"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - connectors
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  retention-scheduler:
    <<: *backend
    profiles: ["retention-archive"]
    secrets:
      - postgres_retention_scheduler_password
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.retention_scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    volumes:
      - ./runtime/retention-execution.enabled:/run/datariver/retention-execution.enabled:ro
    expose:
      - "${RETENTION_METRICS_PORT:-9102}"
    mem_limit: 256m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  retention-archive-worker:
    <<: *backend
    profiles: ["retention-archive"]
    secrets:
      - postgres_archive_password
      - s3_archive_access_key
      - s3_archive_secret_key
    command: ["/app/.venv/bin/python", "-m", "datariver.workers.retention_archive"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - connectors
    volumes:
      - ./runtime/retention-execution.enabled:/run/datariver/retention-execution.enabled:ro
    expose:
      - "${RETENTION_METRICS_PORT:-9102}"
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BROWSER_API_BASE_URL: /api/v1
      BROWSER_OIDC_AUTHORITY: ${OIDC_PUBLIC_AUTHORITY:-http://localhost:8081/realms/datariver}
      BROWSER_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-datariver-web}
      BROWSER_OIDC_REDIRECT_URI: ${APP_PUBLIC_ORIGIN:-http://localhost:8080}
      BROWSER_OIDC_HIGH_ASSURANCE_ACR: ${OIDC_STEP_UP_ACR:-2}
      BROWSER_OIDC_PASSWORD_REAUTH_ACR: ${OIDC_PASSWORD_REAUTH_REQUEST_ACR:-1}
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:-http://localhost:9000}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:-http://localhost:8081}
      DATAHUB_EMBED_BASE_URL: ${DATAHUB_EMBED_BASE_URL:-}
      GRAFANA_EMBED_BASE_URL: ${GRAFANA_EMBED_BASE_URL:-}
      API_PROXY_READ_TIMEOUT_SECONDS: ${API_PROXY_READ_TIMEOUT_SECONDS:-30}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  app:
    internal: false
  data:
    internal: true
  connectors:
    external: true
    name: ${DATARIVER_CONNECTOR_NETWORK:-datariver-connectors}

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  postgres_relay_password:
    file: ./secrets/postgres_relay_password
  postgres_upload_password:
    file: ./secrets/postgres_upload_password
  postgres_governance_password:
    file: ./secrets/postgres_governance_password
  postgres_export_password:
    file: ./secrets/postgres_export_password
  postgres_retention_scheduler_password:
    file: ./secrets/postgres_retention_scheduler_password
  postgres_archive_password:
    file: ./secrets/postgres_archive_password
  postgres_bootstrap_password:
    file: ./secrets/postgres_bootstrap_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  airflow_db_password:
    file: ./secrets/airflow_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  airflow_client_secret:
    file: ./secrets/airflow_client_secret
  keycloak_identity_admin_client_secret:
    file: ./secrets/keycloak_identity_admin_client_secret
  airflow_api_secret:
    file: ./secrets/airflow_api_secret
  airflow_admin_password:
    file: ./secrets/airflow_admin_password
  redis_cache_password:
    file: ./secrets/redis_cache_password
  redis_delivery_password:
    file: ./secrets/redis_delivery_password
  datahub_token:
    file: ./secrets/datahub_token
  intranet_llm_chat_api_key:
    file: ./secrets/intranet_llm_chat_api_key
  intranet_llm_embedding_api_key:
    file: ./secrets/intranet_llm_embedding_api_key
  neo4j_auth:
    file: ./secrets/neo4j_auth
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  s3_export_access_key:
    file: ./secrets/s3_export_access_key
  s3_export_secret_key:
    file: ./secrets/s3_export_secret_key
  s3_archive_access_key:
    file: ./secrets/s3_archive_access_key
  s3_archive_secret_key:
    file: ./secrets/s3_archive_secret_key
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

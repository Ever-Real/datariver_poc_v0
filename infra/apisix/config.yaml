apisix:
  node_listen:
    - port: 9080
  enable_admin: false
  enable_control: false
  show_upstream_status_in_response_header: false

discovery:
  dns:
    # Docker's embedded resolver tracks service-container replacement. Literal
    # host-development IPs are accepted by the same APISIX DNS client path.
    servers:
      - "127.0.0.11:53"
    order: [last, A, AAAA, CNAME]

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  error_log_level: warn
  worker_processes: auto
  event:
    worker_connections: 1024
  http:
    access_log: /dev/stdout
    client_max_body_size: 12m
    keepalive_timeout: 30s

services:
  api:
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    image: datariver-keycloak:26.7.0
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)";
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)";
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: datariver-bootstrap
      KC_HOSTNAME: ${OIDC_PUBLIC_ORIGIN:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
      - airflow_client_secret
      - keycloak_identity_admin_client_secret
      - keycloak_demo_password
    volumes:
      - ./runtime/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1200m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  keycloak-data:

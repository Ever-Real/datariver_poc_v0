services:
  # The host development topology runs DataHub in a separate Compose project.
  # Backend callers use the GMS service name on its dedicated Docker network;
  # host.docker.internal is intentionally reserved for source processes run on the host.
  api:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - app
      - data
      - datahub

  outbox-relay:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - data
      - datahub

  upload-worker:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - data
      - datahub

  upload-validation-worker:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - data
      - datahub

  governance-apply-worker:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - data
      - datahub

  postgres:
    networks:
      - data
      - host-dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  valkey-cache:
    networks:
      - data
      - host-dev
    ports:
      - "127.0.0.1:${VALKEY_CACHE_PORT:-6379}:6379"

  valkey-queue:
    networks:
      - data
      - host-dev
    ports:
      - "127.0.0.1:${VALKEY_QUEUE_PORT:-6380}:6379"

  seaweedfs:
    networks:
      - data
      - host-dev

networks:
  host-dev:
    internal: false
  datahub:
    external: true
    name: ${DATAHUB_DOCKER_NETWORK:-datahub_network}

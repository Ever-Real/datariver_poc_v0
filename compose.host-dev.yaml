services:
  airflow-api-server:
    environment:
      DATARIVER_API_BASE_URL: ${DATARIVER_API_BASE_URL:-http://apisix:9080}

  airflow-scheduler:
    environment:
      DATARIVER_API_BASE_URL: ${DATARIVER_API_BASE_URL:-http://apisix:9080}

  airflow-dag-processor:
    environment:
      DATARIVER_API_BASE_URL: ${DATARIVER_API_BASE_URL:-http://apisix:9080}

  airflow-triggerer:
    environment:
      DATARIVER_API_BASE_URL: ${DATARIVER_API_BASE_URL:-http://apisix:9080}

  postgres:
    networks:
      - data
      - host-dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  valkey-cache:
    networks:
      - data
      - host-dev
    ports:
      - "127.0.0.1:${VALKEY_CACHE_PORT:-6379}:6379"

  valkey-queue:
    networks:
      - data
      - host-dev
    ports:
      - "127.0.0.1:${VALKEY_QUEUE_PORT:-6380}:6379"

  seaweedfs:
    networks:
      - data
      - host-dev

networks:
  host-dev:
    internal: false

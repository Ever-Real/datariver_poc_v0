services:
  # The host development topology runs DataHub in a separate Compose project.
  # Backend callers use the GMS service name on its dedicated Docker network;
  # host.docker.internal is intentionally reserved for source processes run on the host.
  api:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - app
      - data
      - datahub

  outbox-relay:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - data
      - datahub

  upload-worker:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - data
      - datahub

  upload-validation-worker:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - data
      - datahub

  governance-apply-worker:
    environment:
      DATAHUB_BASE_URL: ${DATAHUB_CONTAINER_BASE_URL:-http://datahub-gms:8080}
    networks:
      - data
      - datahub

  # The governed 105-page PDF extraction endpoint is intentionally synchronous in the local
  # single-node developer profile. Production keeps the 30-second default and must use a durable
  # inference worker before enabling this surface.
  web:
    environment:
      API_PROXY_READ_TIMEOUT_SECONDS: ${HOST_DEV_API_PROXY_READ_TIMEOUT_SECONDS:-900}

  postgres:
    networks:
      - data
      - host-dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

networks:
  host-dev:
    internal: false
  datahub:
    external: true
    name: ${DATAHUB_DOCKER_NETWORK:-datahub_network}
